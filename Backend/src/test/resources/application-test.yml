# Perfil test: la base de datos la levanta Testcontainers (TestcontainersConfiguration) y
# sustituye esta conexión; los valores solo evitan exigir variables de entorno al probar.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/prueba
    username: prueba
    password: prueba

app:
  seguridad:
    bcrypt-coste: 4
    intentos-maximos: 3
  documentos:
    directorio: target/almacenamiento-pruebas
  # Sin planificador: las pruebas ejecutan los reintentos vencidos a mano. Timeout corto para el escenario TIMEOUT.
  verificaciones:
    reintentos-automaticos: false
    fuentes:
      te:
        timeout-ms: 300
        espera-base-ms: 0
      css:
        timeout-ms: 300
        espera-base-ms: 0
      registro-publico:
        timeout-ms: 300
        espera-base-ms: 0
