server {
    listen 80;
    root /usr/share/nginx/html;
    absolute_redirect off;

    # Comprobación de salud del contenedor.
    location = /salud {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # La aplicación vive en html/index.html y referencia ../css y ../js.
    location = / {
        return 302 /html/index.html;
    }

    # La API se sirve desde el mismo origen que el frontend: sin CORS ni puertos en el cliente.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 16m;
    }

    location / {
        try_files $uri =404;
    }
}
