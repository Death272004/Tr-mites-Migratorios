server {
    listen 80;
    root /usr/share/nginx/html;
    absolute_redirect off;

    # Cabeceras de seguridad (HU-28, TASK-28.4; hallazgos ZAP 10038, 10020, 10021, 10063,
    # 90004 y 10036). La aplicación no usa scripts ni estilos en línea ni recursos externos,
    # así que la CSP solo permite el mismo origen. Rigen para todo lo que sirve nginx,
    # también /api: el backend no repite estas cabeceras (ver proxy_hide_header).
    server_tokens off;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # Comprobación de salud del contenedor.
    location = /salud {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # La aplicación vive en html/index.html y referencia ../css y ../js.
    location = / {
        return 302 /html/index.html;
    }

    # La API se sirve desde el mismo origen que el frontend: sin CORS ni puertos en el cliente.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 16m;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Content-Security-Policy;
    }

    location / {
        try_files $uri =404;
    }
}
