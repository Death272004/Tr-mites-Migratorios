server {
    listen 80;
    root /usr/share/nginx/html;
    absolute_redirect off;

    # Comprobación de salud del contenedor.
    location = /salud {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # La aplicación vive en html/index.html y referencia ../css y ../js.
    location = / {
        return 302 /html/index.html;
    }

    location / {
        try_files $uri =404;
    }
}
