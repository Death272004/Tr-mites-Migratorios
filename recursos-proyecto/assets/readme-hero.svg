<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
  <title id="title">Sistema Interoperable de Trámites Migratorios</title>
  <desc id="desc">Cabecera visual con los colores de la aplicación.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0b1b2b"/>
      <stop offset="0.58" stop-color="#123c59"/>
      <stop offset="1" stop-color="#0e283b"/>
    </linearGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#f28c28"/>
      <stop offset="1" stop-color="#56c596"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1200" height="250" rx="24" fill="url(#bg)"/>
  <circle cx="1040" cy="36" r="155" fill="#2e6fa8" opacity=".22" filter="url(#soft)"/>
  <circle cx="1040" cy="36" r="105" fill="none" stroke="#6ea8cf" stroke-width="2" opacity=".6">
    <animate attributeName="r" values="105;118;105" dur="7s" repeatCount="indefinite"/>
  </circle>
  <path d="M0 205 C220 165 355 240 560 188 S900 142 1200 190" fill="none" stroke="url(#line)" stroke-width="3" opacity=".8">
    <animate attributeName="d" dur="9s" repeatCount="indefinite" values="M0 205 C220 165 355 240 560 188 S900 142 1200 190;M0 190 C220 230 355 155 560 205 S900 185 1200 160;M0 205 C220 165 355 240 560 188 S900 142 1200 190"/>
  </path>
  <rect x="55" y="56" width="8" height="132" rx="4" fill="#f28c28"/>
  <text x="92" y="92" fill="#f28c28" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="3">PLATAFORMA INTEROPERABLE</text>
  <text x="92" y="137" fill="#f4f8fb" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">Trámites Migratorios</text>
  <text x="92" y="168" fill="#b6c9d8" font-family="Arial, Helvetica, sans-serif" font-size="16">Expedientes · documentos · verificaciones · trazabilidad</text>
  <g transform="translate(1010 162)">
    <rect x="0" y="0" width="118" height="42" rx="21" fill="#163f5d" stroke="#56c596" stroke-width="2"/>
    <circle cx="22" cy="21" r="7" fill="#56c596"><animate attributeName="opacity" values="1;.35;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <text x="38" y="27" fill="#f4f8fb" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">MVP</text>
  </g>
</svg>
