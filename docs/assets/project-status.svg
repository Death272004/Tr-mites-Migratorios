<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-labelledby="title desc">
  <title id="title">Estado del proyecto</title>
  <desc id="desc">MVP en desarrollo con trazabilidad, seguridad y pruebas.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0" stop-color="#0b1b2b"/>
      <stop offset="1" stop-color="#123c59"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .pulse { animation: pulse 2.2s ease-in-out infinite; transform-origin: center; }
      @keyframes pulse { 0%,100% { opacity: .55; transform: scale(.92); } 50% { opacity: 1; transform: scale(1.08); } }
    </style>
  </defs>
  <rect width="1200" height="150" rx="22" fill="url(#bg)" stroke="#28546f" stroke-width="2"/>
  <circle cx="1095" cy="-15" r="150" fill="#1d5c7e" opacity=".35"/>
  <circle cx="1095" cy="-15" r="112" fill="none" stroke="#56c596" stroke-opacity=".42" stroke-width="2"/>
  <g font-family="Arial, sans-serif">
    <text x="48" y="48" fill="#f28c28" font-size="16" font-weight="700" letter-spacing="3">PLATAFORMA INTEROPERABLE</text>
    <text x="48" y="86" fill="#f4f7fb" font-size="26" font-weight="700">Un MVP trazable para trámites migratorios</text>
    <text x="48" y="116" fill="#a8bfd0" font-size="16">Expedientes · documentos · verificaciones · auditoría</text>
    <g transform="translate(735 34)">
      <rect width="140" height="80" rx="14" fill="#102f47" stroke="#3a6b84"/>
      <circle class="pulse" cx="28" cy="28" r="8" fill="#56c596" filter="url(#glow)"/>
      <text x="48" y="34" fill="#f4f7fb" font-size="15" font-weight="700">MVP activo</text>
      <rect x="20" y="51" width="98" height="8" rx="4" fill="#35617b"/>
      <rect x="20" y="51" width="73" height="8" rx="4" fill="#f28c28"/>
    </g>
    <g transform="translate(895 34)">
      <rect width="140" height="80" rx="14" fill="#102f47" stroke="#3a6b84"/>
      <circle cx="28" cy="28" r="8" fill="#a78bfa"/>
      <text x="48" y="34" fill="#f4f7fb" font-size="15" font-weight="700">QA activo</text>
      <rect x="20" y="51" width="98" height="8" rx="4" fill="#35617b"/>
      <rect x="20" y="51" width="84" height="8" rx="4" fill="#a78bfa"/>
    </g>
  </g>
</svg>
